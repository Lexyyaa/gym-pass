spring:
  application:
    name: gym
  profiles:
    default: local
  jpa:
    open-in-view: false
    # ddl-auto로 스키마를 만든 뒤 data.sql(seed)을 실행한다
    defer-datasource-initialization: true
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 500
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true
  jackson:
    time-zone: Asia/Seoul
  sql:
    init:
      # src/main/resources/data.sql이 있으면 기동마다 실행한다. 재기동에도 안전하도록 INSERT IGNORE로 쓴다
      mode: always

server:
  shutdown: graceful

# 정책 값 (support/properties)
gym:
  membership:
    # 기간제 개월 수 · 횟수제 이용 횟수 상한 (C-28 · C-34 · D-23)
    max-months: 120
    max-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.hibernate.SQL: debug

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3309/gym?serverTimezone=Asia/Seoul&characterEncoding=utf8
    username: gym
    password: gym
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false